    - data:
        code: "import json\n\n_FIELDS = {\n    \"full_name\": \"{{NAME}}\",\n    \"email\": \"{{EMAIL}}\",\n    \"phone\": \"{{PHONE}}\",\n    \"location\": \"{{LOCATION}}\",\n    \"linkedin\": \"{{LINKEDIN}}\",\n    \"github\": \"{{GITHUB}}\",\n    \"portfolio\": \"{{PORTFOLIO}}\",\n}\n\ndef _token_map(pii):\n    links = pii.get(\"links\") or {}\n    return {\n        token: val\n        for field, token in _FIELDS.items()\n        for val in [links.get(field) or pii.get(field)]\n        if val\n    }\n\ndef main(ssot_json: str, pii_env: str) -> dict:\n    ssot = json.loads(ssot_json)\n    identity = ssot.get(\"identity\") or {}\n    file_map = _token_map(identity.pop(\"pii\", {}) or {})\n    env_map = _token_map(json.loads(pii_env)) if pii_env else {}\n    identity[\"pii_placeholders\"] = sorted(set(file_map) | set(env_map))\n    return {\n        \"redacted_ssot\": json.dumps(ssot, indent=2),\n        \"pii_map\": json.dumps(file_map),\n    }"
        code_language: python3
        desc: Strip identity.pii into pii_map; LLMs only see redacted_ssot. pii_map
          and env PII_JSON must never be referenced in an LLM prompt.
