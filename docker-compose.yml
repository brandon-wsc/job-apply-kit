configs:
  nginx_conf_template:
    content: "# Please do not directly edit this file. Instead, modify the .env variables related to NGINX configuration.\n\nuser  nginx;\nworker_processes  $${NGINX_WORKER_PROCESSES};\n\nerror_log  /var/log/nginx/error.log\
      \ notice;\npid        /var/run/nginx.pid;\n\n\nevents {\n    worker_connections  1024;\n}\n\n\nhttp {\n    include       /etc/nginx/mime.types;\n    default_type  application/octet-stream;\n\n   \
      \ log_format  main  '$$remote_addr - $$remote_user [$$time_local] \"$$request\" '\n                      '$$status $$body_bytes_sent \"$$http_referer\" '\n                      '\"$$http_user_agent\"\
      \ \"$$http_x_forwarded_for\"';\n\n    access_log  /var/log/nginx/access.log  main;\n\n    sendfile        on;\n    #tcp_nopush     on;\n\n    keepalive_timeout  $${NGINX_KEEPALIVE_TIMEOUT};\n\n  \
      \  #gzip  on;\n    client_max_body_size $${NGINX_CLIENT_MAX_BODY_SIZE};\n\n    include /etc/nginx/conf.d/*.conf;\n}\n"
  nginx_proxy_template:
    content: '# Please do not directly edit this file. Instead, modify the .env variables related to NGINX configuration.


      proxy_set_header Host $$host;

      # real_ip configuration must validate upstream proxies before replacing $$remote_addr.

      proxy_set_header X-Forwarded-For $$remote_addr;

      proxy_set_header X-Forwarded-Proto $$scheme;

      proxy_set_header X-Forwarded-Port $$server_port;

      proxy_http_version 1.1;

      proxy_set_header Connection "";

      proxy_buffering off;

      proxy_read_timeout $${NGINX_PROXY_READ_TIMEOUT};

      proxy_send_timeout $${NGINX_PROXY_SEND_TIMEOUT};

      '
  nginx_https_template:
    content: '# Please do not directly edit this file. Instead, modify the .env variables related to NGINX configuration.


      listen $${NGINX_SSL_PORT} ssl;

      ssl_certificate $${SSL_CERTIFICATE_PATH};

      ssl_certificate_key $${SSL_CERTIFICATE_KEY_PATH};

      ssl_protocols $${NGINX_SSL_PROTOCOLS};

      ssl_prefer_server_ciphers on;

      ssl_session_cache shared:SSL:10m;

      ssl_session_timeout 10m;

      '
  nginx_entrypoint:
    content: "#!/bin/bash\n\nHTTPS_CONFIG=''\n\nif [ \"$${NGINX_HTTPS_ENABLED}\" = \"true\" ]; then\n    # Check if the certificate and key files for the specified domain exist\n    if [ -n \"$${CERTBOT_DOMAIN}\"\
      \ ] && \\\n       [ -f \"/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/$${NGINX_SSL_CERT_FILENAME}\" ] && \\\n       [ -f \"/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/$${NGINX_SSL_CERT_KEY_FILENAME}\" ];\
      \ then\n        SSL_CERTIFICATE_PATH=\"/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/$${NGINX_SSL_CERT_FILENAME}\"\n        SSL_CERTIFICATE_KEY_PATH=\"/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/$${NGINX_SSL_CERT_KEY_FILENAME}\"\
      \n    else\n        SSL_CERTIFICATE_PATH=\"/etc/ssl/$${NGINX_SSL_CERT_FILENAME}\"\n        SSL_CERTIFICATE_KEY_PATH=\"/etc/ssl/$${NGINX_SSL_CERT_KEY_FILENAME}\"\n    fi\n    export SSL_CERTIFICATE_PATH\n\
      \    export SSL_CERTIFICATE_KEY_PATH\n\n    # set the HTTPS_CONFIG environment variable to the content of the https.conf.template\n    HTTPS_CONFIG=$$(envsubst < /etc/nginx/https.conf.template)\n\
      \    export HTTPS_CONFIG\n    # Substitute the HTTPS_CONFIG in the default.conf.template with content from https.conf.template\n    envsubst '$${HTTPS_CONFIG}' < /etc/nginx/conf.d/default.conf.template\
      \ > /etc/nginx/conf.d/default.conf\nfi\nexport HTTPS_CONFIG\n\nif [ \"$${NGINX_ENABLE_CERTBOT_CHALLENGE}\" = \"true\" ]; then\n    ACME_CHALLENGE_LOCATION='location /.well-known/acme-challenge/ {\
      \ root /var/www/html; }'\nelse\n    ACME_CHALLENGE_LOCATION=''\nfi\nexport ACME_CHALLENGE_LOCATION\n\nenv_vars=$$(printenv | cut -d= -f1 | sed 's/^/$$/g' | paste -sd, -)\n\nenvsubst \"$$env_vars\"\
      \ < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf\nenvsubst \"$$env_vars\" < /etc/nginx/proxy.conf.template > /etc/nginx/proxy.conf\n\nenvsubst \"$$env_vars\" < /etc/nginx/conf.d/default.conf.template\
      \ > /etc/nginx/conf.d/default.conf\n\n# Start Nginx using the default entrypoint\nexec nginx -g 'daemon off;'\n"
  squid_conf_template:
    content: 'include /etc/squid/dify_common.conf


      acl allowed_domains dstdomain .marketplace.dify.ai


      http_port $${HTTP_PORT}


      http_access deny !Safe_ports

      http_access deny CONNECT !SSL_ports

      http_access allow localhost manager

      http_access deny manager

      include /etc/squid/dify_sandbox_proxy.conf

      include /etc/squid/dify_allow_private.conf

      http_access deny to_private_networks

      http_access allow allowed_domains

      http_access allow client_localnet

      http_access allow localhost

      http_access deny all

      '
  squid_common_template:
    content: "# Shared Squid configuration used by both ssrf_proxy and agent_ssrf_proxy.\n\n################################## ACL Definitions ################################\nacl client_localnet src 0.0.0.1-0.255.255.255\t\
      # RFC 1122 \"this\" network (LAN)\nacl client_localnet src 10.0.0.0/8\t\t# RFC 1918 local private network (LAN)\nacl client_localnet src 100.64.0.0/10\t\t# RFC 6598 shared address space (CGN)\nacl\
      \ client_localnet src 169.254.0.0/16 \t# RFC 3927 link-local (directly plugged) machines\nacl client_localnet src 172.16.0.0/12\t\t# RFC 1918 local private network (LAN)\nacl client_localnet src 192.168.0.0/16\t\
      \t# RFC 1918 local private network (LAN)\nacl client_localnet src fc00::/7       \t# RFC 4193 local private network range\nacl client_localnet src fe80::/10      \t# RFC 4291 link-local (directly\
      \ plugged) machines\n\nacl to_private_networks dst 0.0.0.0/8\nacl to_private_networks dst 10.0.0.0/8\nacl to_private_networks dst 100.64.0.0/10\nacl to_private_networks dst 127.0.0.0/8\nacl to_private_networks\
      \ dst 169.254.0.0/16\nacl to_private_networks dst 172.16.0.0/12\nacl to_private_networks dst 192.168.0.0/16\nacl to_private_networks dst 224.0.0.0/4\nacl to_private_networks dst 240.0.0.0/4\nacl to_private_networks\
      \ dst ::/128\nacl to_private_networks dst ::1/128\nacl to_private_networks dst ::ffff:0:0/96    # IPv4-mapped\nacl to_private_networks dst ::/96            # deprecated IPv4-compatible\nacl to_private_networks\
      \ dst fc00::/7\nacl to_private_networks dst fe80::/10\n\nacl SSL_ports port 443\nacl Safe_ports port 80\t\t# http\nacl Safe_ports port 21\t\t# ftp\nacl Safe_ports port 443\t\t# https\nacl Safe_ports\
      \ port 70\t\t# gopher\nacl Safe_ports port 210\t\t# wais\nacl Safe_ports port 1025-65535\t# unregistered ports\nacl Safe_ports port 280\t\t# http-mgmt\nacl Safe_ports port 488\t\t# gss-http\nacl Safe_ports\
      \ port 591\t\t# filemaker\nacl Safe_ports port 777\t\t# multiling http\nacl CONNECT method CONNECT\n\n################################## Common Parameters ################################\n\ntcp_outgoing_address\
      \ 0.0.0.0\n\n################################## Proxy Server ################################\ncoredump_dir $${COREDUMP_DIR}\nrefresh_pattern ^ftp:\t\t1440\t20%\t10080\nrefresh_pattern ^gopher:\t\
      1440\t0%\t1440\nrefresh_pattern -i (/cgi-bin/|\\?) 0\t0%\t0\nrefresh_pattern \\/(Packages|Sources)(|\\.bz2|\\.gz|\\.xz)$$ 0 0% 0 refresh-ims\nrefresh_pattern \\/Release(|\\.gpg)$$ 0 0% 0 refresh-ims\n\
      refresh_pattern \\/InRelease$$ 0 0% 0 refresh-ims\nrefresh_pattern \\/(Translation-.*)(|\\.bz2|\\.gz|\\.xz)$$ 0 0% 0 refresh-ims\nrefresh_pattern .\t\t0\t20%\t4320\n\n##################################\
      \ Request Buffer ################################\nclient_request_buffer_max_size 100 MB\n\n################################## Performance & Concurrency ###############################\nmax_filedescriptors\
      \ 65536\nconnect_timeout 30 seconds\nrequest_timeout 2 minutes\nread_timeout 2 minutes\nclient_lifetime 5 minutes\nshutdown_lifetime 30 seconds\n\nserver_persistent_connections on\nclient_persistent_connections\
      \ on\npersistent_request_timeout 30 seconds\npconn_timeout 1 minute\n\nclient_db on\nserver_idle_pconn_timeout 2 minutes\nclient_idle_pconn_timeout 2 minutes\n\nquick_abort_min 16 KB\nquick_abort_max\
      \ 16 MB\nquick_abort_pct 95\n\nmemory_cache_mode disk\ncache_mem 256 MB\nmaximum_object_size_in_memory 512 KB\n\ndns_timeout 30 seconds\ndns_retransmit_interval 5 seconds\n\nlogformat dify_log %ts.%03tu\
      \ %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt\naccess_log daemon:/var/log/squid/access.log dify_log\nlogfile_rotate 10\n"
  squid_entrypoint:
    content: "#!/bin/bash\n\n# Modified based on Squid OCI image entrypoint\n\n# This entrypoint aims to forward the squid logs to stdout to assist users of\n# common container related tooling (e.g., kubernetes,\
      \ docker-compose, etc) to\n# access the service logs.\n\n# Moreover, it invokes the squid binary, leaving all the desired parameters to\n# be provided by the \"command\" passed to the spawned container.\
      \ If no command\n# is provided by the user, the default behavior (as per the CMD statement in\n# the Dockerfile) will be to use Ubuntu's default configuration [1] and run\n# squid with the \"-NYC\"\
      \ options to mimic the behavior of the Ubuntu provided\n# systemd unit.\n\n# [1] The default configuration is changed in the Dockerfile to allow local\n# network connections. See the Dockerfile for\
      \ further information.\n\necho \"[ENTRYPOINT] re-create snakeoil self-signed certificate removed in the build process\"\nif [ ! -f /etc/ssl/private/ssl-cert-snakeoil.key ]; then\n    /usr/sbin/make-ssl-cert\
      \ generate-default-snakeoil --force-overwrite > /dev/null 2>&1\nfi\n\ntail -F /var/log/squid/access.log 2>/dev/null &\ntail -F /var/log/squid/error.log 2>/dev/null &\ntail -F /var/log/squid/store.log\
      \ 2>/dev/null &\ntail -F /var/log/squid/cache.log 2>/dev/null &\n\nALLOW_PRIVATE_CONF=/etc/squid/dify_allow_private.conf\nSANDBOX_PROXY_CONF=/etc/squid/dify_sandbox_proxy.conf\n\nwrite_optional_private_allowlist()\
      \ {\n    local env_name=\"$$1\"\n    local acl_name=\"$$2\"\n    local acl_type=\"$$3\"\n    local raw_values=\"$${!env_name:-}\"\n\n    raw_values=\"$${raw_values//,/ }\"\n\n    if [ -z \"$${raw_values//[[:space:]]/}\"\
      \ ]; then\n        return\n    fi\n\n    printf 'acl %s %s' \"$$acl_name\" \"$$acl_type\" >> \"$$ALLOW_PRIVATE_CONF\"\n    for value in $$raw_values; do\n        printf ' %s' \"$$value\" >> \"$$ALLOW_PRIVATE_CONF\"\
      \n    done\n    printf '\\nhttp_access allow client_localnet %s\\n' \"$$acl_name\" >> \"$$ALLOW_PRIVATE_CONF\"\n}\n\n{\n    echo \"# Generated by docker-entrypoint.sh.\"\n    echo \"# Allows selected\
      \ private targets before the default private-network deny rule.\"\n} > \"$$ALLOW_PRIVATE_CONF\"\nwrite_optional_private_allowlist \"SSRF_PROXY_ALLOW_PRIVATE_IPS\" \"dify_allowed_private_networks\"\
      \ \"dst\"\nwrite_optional_private_allowlist \"SSRF_PROXY_ALLOW_PRIVATE_DOMAINS\" \"dify_allowed_private_domains\" \"dstdomain\"\n\n{\n    echo \"# Generated by docker-entrypoint.sh.\"\n    echo \"\
      # Enables the middleware-only sandbox host bridge when configured.\"\n} > \"$$SANDBOX_PROXY_CONF\"\n\nif [ -n \"$${SSRF_SANDBOX_PROXY_PORT:-}\" ]; then\n    sandbox_proxy_host=\"$${SSRF_SANDBOX_PROXY_HOST:-sandbox}\"\
      \n    sandbox_proxy_target_port=\"$${SANDBOX_PORT:-8194}\"\n\n    {\n        printf 'http_port %s accel vhost\\n' \"$$SSRF_SANDBOX_PROXY_PORT\"\n        printf 'cache_peer %s parent %s 0 no-query\
      \ originserver name=dify_sandbox\\n' \\\n            \"$$sandbox_proxy_host\" \\\n            \"$$sandbox_proxy_target_port\"\n        printf 'acl dify_sandbox_proxy_port localport %s\\n' \"$$SSRF_SANDBOX_PROXY_PORT\"\
      \n        printf 'http_access allow dify_sandbox_proxy_port\\n'\n    } >> \"$$SANDBOX_PROXY_CONF\"\nfi\n\n# Replace environment variables in a template file.\nexpand_env() {\n    awk '{\n        while(match($$0,\
      \ /\\$${[A-Za-z_][A-Za-z_0-9]*}/)) {\n            var = substr($$0, RSTART+2, RLENGTH-3)\n            val = ENVIRON[var]\n            $$0 = substr($$0, 1, RSTART-1) val substr($$0, RSTART+RLENGTH)\n\
      \        }\n        print\n    }' \"$$1\"\n}\n\n# Replace environment variables in the templates and output to squid.conf\necho \"[ENTRYPOINT] replacing environment variables in the templates\"\n\
      expand_env /etc/squid/squid.conf.template > /etc/squid/squid.conf\nexpand_env /etc/squid/dify_common.conf.template > /etc/squid/dify_common.conf\n\n/usr/sbin/squid -Nz\necho \"[ENTRYPOINT] starting\
      \ squid\"\n/usr/sbin/squid -f /etc/squid/squid.conf -NYC 1\n"
  sandbox_config:
    content: "app:\n  port: 8194\n  debug: True\n  key: dify-sandbox\nmax_workers: 4\nmax_requests: 50\nworker_timeout: 5\nenable_network: True # please make sure there is no network risk in your environment\n\
      allowed_syscalls: # please leave it empty if you have no idea how seccomp works\nproxy:\n  socks5: ''\n  http: ''\n  https: ''\n"
  nginx_default_conf_template:
    content: "# Please do not directly edit this file. Instead, modify the .env variables related to NGINX configuration.\n\nserver {\n    listen $${NGINX_PORT};\n    server_name $${NGINX_SERVER_NAME};\n\
      \    resolver 127.0.0.11 valid=30s ipv6=off;\n\n    location /console/api {\n      set $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n      include proxy.conf;\n    }\n\n    location\
      \ /api {\n      set $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n      include proxy.conf;\n    }\n\n    location /socket.io/ {\n      set $$socket_io_upstream $${NGINX_SOCKET_IO_UPSTREAM};\n\
      \      proxy_pass http://$$socket_io_upstream;\n      include proxy.conf;\n      proxy_set_header Upgrade $$http_upgrade;\n      proxy_set_header Connection \"upgrade\";\n      proxy_cache_bypass\
      \ $$http_upgrade;\n    }\n\n    location /v1 {\n      set $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n      include proxy.conf;\n    }\n\n    location /openapi {\n      set\
      \ $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n      include proxy.conf;\n    }\n\n    location /files {\n      set $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n\
      \      include proxy.conf;\n    }\n\n    location /explore {\n      set $$web_upstream web:3000;\n      proxy_pass http://$$web_upstream;\n      include proxy.conf;\n    }\n\n    location /e/ {\n\
      \      set $$plugin_daemon_upstream plugin_daemon:5002;\n      proxy_pass http://$$plugin_daemon_upstream;\n      proxy_set_header Dify-Hook-Url $$scheme://$$host$$request_uri;\n      include proxy.conf;\n\
      \    }\n\n    location / {\n      set $$web_upstream web:3000;\n      proxy_pass http://$$web_upstream;\n      include proxy.conf;\n    }\n\n    location /mcp {\n      set $$api_upstream api:5001;\n\
      \      proxy_pass http://$$api_upstream;\n      include proxy.conf;\n    }\n\n    location /triggers {\n      set $$api_upstream api:5001;\n      proxy_pass http://$$api_upstream;\n      include proxy.conf;\n\
      \    }\n    \n    # placeholder for acme challenge location\n    $${ACME_CHALLENGE_LOCATION}\n\n    # placeholder for https config defined in https.conf.template\n    $${HTTPS_CONFIG}\n}\n"
