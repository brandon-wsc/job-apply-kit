# Self-contained Dify 1.17.1 stack — single-file Docker Compose deployment.
# Generated from langgenius/dify docker/docker-compose.yaml: all config files
# (nginx, squid, sandbox) are embedded base64 in `environment` and decoded by
# each service's entrypoint, data lives in named volumes. No .env file or
# sibling directories required — a single paste works anywhere, including
# Synology Container Manager (no `configs:` feature needed).
#
# Before `docker compose up -d` / pasting into a compose UI (e.g. Synology
# Container Manager -> Project), review:
#   1. nginx ports — published as 8080:80 and 8443:443 so they don't clash
#      with a host web server; change `published` if 80/443 are free.
#
# SECRET_KEY is auto-generated once by the one-shot `init-secret` service
# into the `secret_key` volume and injected at container start — nothing to
# edit. Rotate it with `docker compose down && docker volume rm
# dify_secret_key && docker compose up -d` (invalidates all sessions).
#
# Needs ~8 GB free RAM (api OOMs during migrations under ~4 GB) and x86_64.
# Optional services removed vs upstream: certbot, agent stack, alternative
# vector DBs — weaviate is the store.
#
# NOTE: this is a convenience snapshot pinned to Dify 1.17.1, not a
# maintained fork of upstream deployment. To upgrade Dify, regenerate
# from that release's docker/docker-compose.yaml (same transform) rather
# than editing this file.

